[package]
name = "zstd"
version = "1.5.7"
type = "lib"

[language]
c = "c17"

# Release asset rather than the auto-generated tag archive: uploaded
# bytes are immutable, so this URL fetches and hashes identically
# forever. (The original lock mismatch across machines was bake's tree
# hash counting permission bits — fixed there — but pinned bytes remain
# strictly more robust.)
[dependencies]
upstream = { url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz" }

# Single-threaded (no ZSTD_MULTITHREAD); legacy formats and dictBuilder are
# not part of the port.
